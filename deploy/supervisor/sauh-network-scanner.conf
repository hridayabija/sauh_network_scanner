[program:sauh-network-scanner]
; Замените /home/scanner на домашний каталог пользователя этой машины.
directory=/home/scanner/sauh_network_scanner
; Собственное окружение сканера; не требуется код бота, PostgreSQL или SSH.
command=/home/scanner/sauh_network_scanner/.venv/bin/python -u -m sauh_network_scanner --config scanner.yaml run
; Непривилегированный локальный пользователь.
user=scanner
; Автозапуск после настройки индивидуального ключа и sing-box.
autostart=true
; Перезапуск при аварии.
autorestart=unexpected
; Проверка начального запуска, секунды.
startsecs=10
; Количество попыток запуска.
startretries=5
; Сигнал корректной остановки проверок и сохранения результатов.
stopsignal=INT
; Запас для окончания ограниченных по времени активных проверок.
stopwaitsecs=240
; Сигнал только управляющему процессу: активные проверки завершаются и сохраняются.
stopasgroup=false
; Принудительное завершение всей группы по таймауту.
killasgroup=true
; Немедленная запись логов без буферизации.
environment=PYTHONUNBUFFERED="1"
; Создайте каталог logs перед включением Supervisor.
stdout_logfile=/home/scanner/sauh_network_scanner/logs/scanner.log
; Максимальный размер локального лог-файла.
stdout_logfile_maxbytes=10MB
; Число сохранённых ротаций.
stdout_logfile_backups=5
; stderr попадает в тот же локальный лог; события также отправляются API.
redirect_stderr=true
