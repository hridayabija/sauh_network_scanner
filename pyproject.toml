[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kauliki_network_scanner"
version = "1.0.0"
description = "Independent Windows, Linux and macOS VPN/MTProxy validation agent"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.12,<4", "pydantic>=2.10,<3", "PyYAML>=6,<7", "cryptography>=44", "psutil>=5.9,<8"]

[project.scripts]
kauliki_network_scanner = "kauliki_network_scanner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kauliki_network_scanner = ["core-releases.json"]

[tool.ruff]
target-version = "py311"
